services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cib}
      POSTGRES_DB: ${POSTGRES_DB:-cib}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cib} -d ${POSTGRES_DB:-cib}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cib}:${POSTGRES_PASSWORD:-cib}@postgres:5432/${POSTGRES_DB:-cib}?sslmode=disable
      API_PORT: ${API_PORT:-8080}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - api

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    profiles: ["v2"]
    ports:
      - "8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  # v2: PuppyGraph engine for graph-query workloads — no v1 consumer yet
  # (Go adapter deleted in cycle 2; will be reintroduced when persistence lands).
  puppygraph:
    image: puppygraph/puppygraph:latest
    profiles: ["v2"]
    ports:
      - "8081:8081"
    volumes:
      - puppygraph-data:/data

volumes:
  postgres-data:
  clickhouse-data:
  puppygraph-data:

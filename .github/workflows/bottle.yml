name: Build Homebrew bottle

# Why this exists
# ---------------
# claude-foundation's formula compiles nothing — `install` only copies files.
# Homebrew still runs its fatal "Xcode/CLT too outdated" check on every
# build-from-source install (formula_installer.rb:
#   `if !pour_bottle? && DevelopmentTools.installed?` -> perform_build_from_source_checks).
# With no bottle published, every `brew install` is build-from-source, so users
# on a newer macOS with an older Xcode are blocked for a toolchain they never
# need. Publishing a bottle makes `pour_bottle?` true and skips the check.
#
# This builds the bottle on a current-Xcode runner (so the check passes *here*),
# uploads it to the release, and prints the `bottle do` block to paste into the
# formula. The formula bakes an absolute prefix into its `bin` wrapper, so brew
# produces a *per-platform* bottle (e.g. `arm64_tahoe`), not an `:all` bottle —
# each platform that wants the no-toolchain install gets its own bottle line;
# platforms with no matching line fall back to build-from-source. See RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build the bottle for, e.g. v2.5.10"
        required: true

permissions:
  contents: write # upload the bottle asset to the GitHub release

jobs:
  bottle:
    # macos-latest ships a current Xcode, so Homebrew's toolchain check passes.
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
      TAP: maximumsoft-co-ltd/claude-foundation
      GH_TOKEN: ${{ github.token }}
    steps:
      # Check out `main` for the formula *shape* only. Its `url`/`sha256` are
      # NOT trusted — depending on release order they may still point at the
      # previous version (the bump can land after the tag; see RELEASING.md).
      # The build step below always rewrites them to $TAG, so this workflow
      # bottles the right source no matter which came first. (v2.8.1 shipped a
      # 2.6.8-payload bottle because the old version trusted main's formula.)
      - name: Check out the released formula (from main)
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Build the bottle
        run: |
          set -euo pipefail
          ROOT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          # Force the formula onto the tag being bottled: fetch the tag's source
          # tarball (fails fast on a bad/missing tag), compute its sha, and
          # rewrite the formula's `url` + source `sha256` (the bottle block's
          # `sha256 cellar:` line is untouched — the pattern requires the quote).
          SRC_URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL "$SRC_URL" -o src.tar.gz
          SRC_SHA="$(shasum -a 256 src.tar.gz | cut -d' ' -f1)"
          sed -i '' -E "s|^( *url ).*|\1\"${SRC_URL}\"|" Formula/claude-foundation.rb
          sed -i '' -E "s|^( *sha256 )\"[0-9a-f]{64}\"|\1\"${SRC_SHA}\"|" Formula/claude-foundation.rb
          grep -q "tags/${TAG}.tar.gz" Formula/claude-foundation.rb  # sanity: rewrite landed

          # Put the patched formula into a local tap so brew can build it.
          brew tap-new "$TAP" --no-git
          cp Formula/claude-foundation.rb "$(brew --repository "$TAP")/Formula/"

          # --build-bottle installs from the released source tarball (the formula's
          # `url`); brew bottle emits a per-platform bottle + a DSL block on stdout.
          # --root-url bakes the release-download URL into that block.
          brew install --build-bottle "$TAP/claude-foundation"
          brew test "$TAP/claude-foundation"
          brew bottle --json --no-rebuild \
            --root-url "$ROOT_URL" \
            "$TAP/claude-foundation" | tee bottle.out

          echo "Built artifacts:"
          ls -1 claude-foundation--*.bottle.tar.gz

      - name: Upload the bottle to the release
        run: |
          set -euo pipefail
          # brew writes the file as `name--version` (double dash), but a custom
          # root_url downloads via url_encode = `name-version` (single dash).
          # Rename so the uploaded asset matches the URL brew will request.
          for f in claude-foundation--*.bottle.tar.gz; do
            mv "$f" "${f/--/-}"
          done
          gh release upload "$TAG" claude-foundation-*.bottle.tar.gz \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Emit the bottle block to paste into the formula
        run: |
          set -euo pipefail
          {
            echo "## Bottle built for \`${TAG}\`"
            echo
            echo "Uploaded to the \`${TAG}\` release. Paste/merge this block into"
            echo "\`Formula/claude-foundation.rb\` right after the \`head\` line, then"
            echo "commit + merge (see RELEASING.md):"
            echo
            echo '```ruby'
            # brew bottle prints the ready DSL block to stdout — lift it verbatim.
            sed -n '/bottle do/,/^[[:space:]]*end/p' bottle.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

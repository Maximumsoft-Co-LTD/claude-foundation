name: Build :all bottle

# Why this exists
# ---------------
# claude-foundation's formula compiles nothing — `install` only copies files.
# Homebrew still runs its fatal "Xcode/CLT too outdated" check on every
# build-from-source install (formula_installer.rb:
#   `if !pour_bottle? && DevelopmentTools.installed?` -> perform_build_from_source_checks).
# With no bottle published, every `brew install` is build-from-source, so users
# on a newer macOS with an older Xcode are blocked for a toolchain they never
# need. Shipping one platform-independent `:all` bottle makes `pour_bottle?`
# true and skips the check entirely.
#
# This job builds that `:all` bottle on a current-Xcode runner (so the check
# passes *here*), uploads it to the release, and prints the `bottle do` block to
# paste into Formula/claude-foundation.rb. See RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build the bottle for, e.g. v2.5.9"
        required: true

permissions:
  contents: write # upload the bottle asset to the GitHub release

jobs:
  bottle:
    # macos-latest ships a current Xcode, so Homebrew's toolchain check passes.
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
      TAP: maximumsoft-co-ltd/claude-foundation
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the tagged formula
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      - name: Build the :all bottle
        run: |
          set -euo pipefail
          ROOT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          # Put the checked-out formula into a local tap so brew can build it.
          brew tap-new "$TAP" --no-git
          cp Formula/claude-foundation.rb "$(brew --repository "$TAP")/Formula/"

          # --build-bottle installs from the tagged source tarball (the formula's
          # `url`). brew bottle auto-detects platform independence and emits an
          # `:all` bottle by default (opt out with --no-all-checks); --root-url
          # bakes the release-download URL into the generated block.
          brew install --build-bottle "$TAP/claude-foundation"
          brew bottle --json --no-rebuild \
            --root-url "$ROOT_URL" \
            "$TAP/claude-foundation" | tee bottle.out

          echo "Built artifacts:"
          ls -1 claude-foundation--*.all.bottle.tar.gz

      - name: Upload the bottle to the release
        run: |
          set -euo pipefail
          gh release upload "$TAG" claude-foundation--*.all.bottle.tar.gz \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Emit the bottle block to paste into the formula
        run: |
          set -euo pipefail
          {
            echo "## :all bottle built for \`${TAG}\`"
            echo
            echo "Uploaded to the \`${TAG}\` release. Paste this block into"
            echo "\`Formula/claude-foundation.rb\` right after the \`head\` line, then"
            echo "commit + merge (see RELEASING.md):"
            echo
            echo '```ruby'
            # brew bottle prints the ready DSL block to stdout — lift it verbatim.
            sed -n '/bottle do/,/^[[:space:]]*end/p' bottle.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

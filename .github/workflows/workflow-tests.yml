name: workflow-tests

# Runs the deterministic workflow test harness (.claude/tests/run-all.sh) on any
# change to the workflow product. Live e2e / benchmark suites are token-costed and
# stay off in CI (run-all.sh skips them unless CLAUDE_E2E=1).
on:
  pull_request:
    paths:
      - '.claude/**'
      - '.foundation/**'
      - 'openspec/**'
      - 'Formula/**'
      - 'cli.sh'
      - 'install.sh'
      - 'install-*.sh'
      - 'dashboard/**'
      - 'website/**'
      - 'examples/**'
      - 'quality/**'
      - 'scripts/quality/**'
      - 'scripts/release/**'
      - 'RELEASING.md'
      - 'VERSION'
      - '.github/workflows/release*.yml'
      - '.github/workflows/bottle*.yml'
      - '.github/workflows/pages*.yml'
      - 'stryker.dashboard.config.mjs'
      - 'stryker.runtime.config.mjs'
      - 'stryker.examples.config.mjs'
      - 'stryker.website.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'foundation.json'
      - 'README.md'
      - 'README.th.md'
      - 'WORKFLOW.md'
      - '.workflow/_templates/**'
      - '.github/workflows/workflow-tests.yml'
  push:
    branches: [main]
    paths:
      - '.claude/**'
      - '.foundation/**'
      - 'openspec/**'
      - 'Formula/**'
      - 'cli.sh'
      - 'install.sh'
      - 'install-*.sh'
      - 'dashboard/**'
      - 'website/**'
      - 'examples/**'
      - 'quality/**'
      - 'scripts/quality/**'
      - 'stryker.dashboard.config.mjs'
      - 'scripts/release/**'
      - 'RELEASING.md'
      - 'VERSION'
      - '.github/workflows/release*.yml'
      - '.github/workflows/bottle*.yml'
      - '.github/workflows/pages*.yml'
      - 'stryker.runtime.config.mjs'
      - 'stryker.examples.config.mjs'
      - 'stryker.website.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'foundation.json'
      - 'README.md'
      - 'README.th.md'
      - 'WORKFLOW.md'
      - '.workflow/_templates/**'
      - '.github/workflows/workflow-tests.yml'
  workflow_dispatch: {}

jobs:
  minimum-runtime:
    runs-on: ubuntu-latest
    env:
      FOUNDATION_UPDATE_CHECK: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
      - name: Verify minimum supported runtime and installed consumer
        run: |
          node --test .claude/harness/tests/land-grant.test.mjs .claude/harness/tests/execution-graph.test.mjs .claude/harness/tests/npm-lockfile-check.test.mjs
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          bash install.sh "$consumer" --yes
          cd "$consumer"
          # Validate install readiness without requiring a paid reviewer host.
          node .claude/harness/foundation.mjs doctor --stage change

  deterministic:
    runs-on: ubuntu-latest
    steps:
      # Upgrade compatibility archives the real previous release tag, so the
      # deterministic job needs release history rather than a depth-1 checkout.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned workflow dependencies
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Ensure jq (harness dependency)
        run: command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }
      - name: Run workflow test harness
        run: sh .claude/tests/run-all.sh
      - name: Check packaged CLI contract
        # Default help is the small agent-facing lifecycle surface. Compatibility
        # primitives remain discoverable only through help --all.
        run: |
          bash cli.sh help | grep -F "change start"
          bash cli.sh help | grep -F "change amend"
          bash cli.sh help | grep -F "advance"
          bash cli.sh help --all | grep -F "change new"
          bash cli.sh help --all | grep -F "proof run"
          bash cli.sh help --all | grep -F "land check"
          ruby -c Formula/claude-foundation.rb

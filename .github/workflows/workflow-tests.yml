name: workflow-tests

# Runs the deterministic workflow test harness (.claude/tests/run-all.sh) on any
# change to the workflow product. Live e2e / benchmark suites are token-costed and
# stay off in CI (run-all.sh skips them unless CLAUDE_E2E=1).
on:
  pull_request:
    paths:
      - '.claude/**'
      - '.foundation/**'
      - 'openspec/**'
      - 'Formula/**'
      - 'cli.sh'
      - 'install.sh'
      - 'install-*.sh'
      - 'dashboard/**'
      - 'package.json'
      - 'package-lock.json'
      - 'foundation.json'
      - 'README.md'
      - 'README.th.md'
      - 'WORKFLOW.md'
      - '.workflow/_templates/**'
      - '.github/workflows/workflow-tests.yml'
  push:
    branches: [main]
    paths:
      - '.claude/**'
      - '.foundation/**'
      - 'openspec/**'
      - 'Formula/**'
      - 'cli.sh'
      - 'install.sh'
      - 'install-*.sh'
      - 'dashboard/**'
      - 'package.json'
      - 'package-lock.json'
      - 'foundation.json'
      - 'README.md'
      - 'README.th.md'
      - 'WORKFLOW.md'
      - '.workflow/_templates/**'
      - '.github/workflows/workflow-tests.yml'
  workflow_dispatch: {}

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      # Upgrade compatibility archives the real previous release tag, so the
      # deterministic job needs release history rather than a depth-1 checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned workflow dependencies
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Ensure jq (harness dependency)
        run: command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }
      - name: Run workflow test harness
        run: sh .claude/tests/run-all.sh
      - name: Check packaged CLI contract
        # Canonical public vocabulary only. `proof plan` and `runtime new` are
        # legacy names that still resolve but are deliberately absent from help,
        # and run-context-budget-tests.sh fails any slash command that uses
        # them — so asserting them here contradicted the suite it runs beside.
        run: |
          bash cli.sh help | grep -F "change new"
          bash cli.sh help | grep -F "proof run"
          bash cli.sh help | grep -F "land check"
          ruby -c Formula/claude-foundation.rb

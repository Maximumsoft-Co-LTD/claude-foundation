name: Release

# One-action release. You do the editorial part — write the changelog entries
# under `## [Unreleased]` and push them to main — then trigger this workflow
# with the new version. It runs everything mechanical end-to-end on a
# current-Xcode macOS runner (so Homebrew's toolchain check passes here):
#   1. rename [Unreleased] -> [X.Y.Z] (dated), add a fresh [Unreleased], fix link refs
#   2. bump VERSION + every executable, protocol, installed guidance, and
#      documentation surface that states the release
#   3. commit `chore(release): vX.Y.Z`, tag vX.Y.Z, push
#   4. compute the source-tarball sha256, bump the formula url + sha256
#   5. publish the GitHub release from the new changelog section
#   6. build the Homebrew bottle, upload it, arm the formula's bottle block
#   7. commit `chore(brew): formula for vX.Y.Z`, push
# Result: 2 bot commits + a tag + a published, bottled release from one click.
#
# `dry_run: true` does steps 1-2, 6 (build the bottle to prove it works) WITHOUT
# any push/tag/publish/upload — use it to rehearse a release safely. A successful
# rehearsal emits source-bound evidence; pass its run id to the real release to
# reuse the expensive gates without trusting a different commit or candidate.
#
# bottle.yml stays as the manual tool for retro-fixing/rebuilding an old tag.
# See RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, no v prefix (e.g. 2.5.11)"
        required: true
      dry_run:
        description: "Rehearse: do edits + build the bottle, but don't push/tag/publish"
        type: boolean
        default: false
      rehearsal_run_id:
        description: "Successful dry-run id for this version and exact source SHA (optional)"
        required: false
        default: ""

permissions:
  actions: read # inspect and download source-bound rehearsal evidence
  contents: write # commit the release + push the tag + create/upload the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Pinned (not macos-latest, which flip-flops during OS migrations) so the
    # bottle tag is deterministic. An older-macOS bottle pours on newer macOS
    # (forward-compatible), so arm64_sequoia also covers arm64_tahoe/macOS 26.
    # Only arm64 macOS is bottled here; Intel/Linux/older macOS fall back to
    # build-from-source. Add a CI matrix + per-tag sha lines to widen coverage.
    runs-on: macos-15
    env:
      NEW: ${{ github.event.inputs.version }}
      DRY: ${{ github.event.inputs.dry_run }}
      REHEARSAL_RUN_ID: ${{ github.event.inputs.rehearsal_run_id }}
      TAP: maximumsoft-co-ltd/claude-foundation
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Bind every check and reusable rehearsal to the dispatch SHA. A later
          # main update then makes the eventual release push fail closed.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Validate inputs + repo state
        run: |
          set -euo pipefail
          [[ "$NEW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version '$NEW' is not X.Y.Z"; exit 1; }
          [[ -z "$REHEARSAL_RUN_ID" || "$REHEARSAL_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::rehearsal_run_id must be a numeric GitHub Actions run id"; exit 1; }
          [ "$DRY" != "true" ] || [ -z "$REHEARSAL_RUN_ID" ] || {
            echo "::error::a dry run cannot reuse another dry run"; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::releases must be dispatched from main, not $GITHUB_REF"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || {
            echo "::error::checkout is not bound to the dispatch SHA"; exit 1; }
          REMOTE_MAIN=$(git ls-remote --heads origin refs/heads/main | awk 'NR == 1 { print $1 }')
          [ -n "$REMOTE_MAIN" ] && [ "$REMOTE_MAIN" = "$GITHUB_SHA" ] || {
            echo "::error::dispatch SHA is not the current origin/main; start a new release run"; exit 1; }
          PREV=$(tr -d '[:space:]' < VERSION)
          echo "PREV=$PREV" >> "$GITHUB_ENV"
          [ "$PREV" != "$NEW" ] || { echo "::error::VERSION is already $NEW"; exit 1; }
          if git rev-parse "v$NEW" >/dev/null 2>&1 || git ls-remote --tags origin "v$NEW" | grep -q .; then
            echo "::error::tag v$NEW already exists"; exit 1
          fi
          # The editorial part you write by hand must be present.
          body=$(awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md | tr -d '[:space:]')
          [ -n "$body" ] || { echo "::error::## [Unreleased] is empty — add changelog entries first"; exit 1; }
          node scripts/release/preflight.mjs
          command -v jq >/dev/null || brew install jq
          echo "PREV=$PREV NEW=$NEW DRY=$DRY REHEARSAL_RUN_ID=${REHEARSAL_RUN_ID:-none}"

      - name: Verify reusable rehearsal evidence
        if: env.REHEARSAL_RUN_ID != ''
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REHEARSAL_RUN_ID")"
          jq -e --arg source "$GITHUB_SHA" '
            .conclusion == "success" and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .head_sha == $source and
            .path == ".github/workflows/release.yml"
          ' <<<"$metadata" >/dev/null || {
            echo "::error::rehearsal run is not a successful Release run for $GITHUB_SHA"; exit 1; }
          evidence_dir="$RUNNER_TEMP/rehearsal-evidence"
          gh run download "$REHEARSAL_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name release-rehearsal-evidence --dir "$evidence_dir"
          node scripts/release/rehearsal-evidence.mjs verify \
            --version "$NEW" --source-head "$GITHUB_SHA" \
            --file "$evidence_dir/manifest.json"

      - name: Require fresh deterministic and mutation evidence
        if: env.REHEARSAL_RUN_ID == ''
        run: |
          set -euo pipefail
          npm ci
          export PATH="$PWD/node_modules/.bin:$PATH"
          # The authoritative suite already contains all six semantic mutation
          # lanes, so do not execute the same mutations a second time here.
          sh .claude/tests/run-all.sh
          npm run test:mutation:dashboard
          npm run quality:mutation:coverage:dashboard
          npm run quality:mutation:normalize:dashboard
          npm run quality:mutation:changed

      - name: Rewrite changelog + bump version mirrors
        run: |
          set -euo pipefail
          DATE=$(date +%F)
          REPO="https://github.com/${GITHUB_REPOSITORY}"

          # Add a dated [NEW] section directly under [Unreleased].
          awk -v new="$NEW" -v date="$DATE" '
            !done && /^## \[Unreleased\]$/ { print; print ""; print "## [" new "] - " date; done=1; next }
            { print }' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md

          # Bump the [Unreleased] link ref + add the [NEW] compare line.
          awk -v new="$NEW" -v prev="$PREV" -v repo="$REPO" '
            /^\[Unreleased\]:/ {
              print "[Unreleased]: " repo "/compare/v" new "...HEAD"
              print "[" new "]: " repo "/compare/v" prev "...v" new
              next }
            { print }' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md

          printf '%s\n' "$NEW" > VERSION

          perl -pi -e "s/const VERSION = \"\Q${PREV}\E\"/const VERSION = \"${NEW}\"/" \
            .claude/harness/foundation.mjs
          perl -pi -e "s/\"runtime\": \"\Q${PREV}\E\"/\"runtime\": \"${NEW}\"/" \
            .claude/harness/protocol.json
          perl -pi -e "s/Change Loop \Q${PREV}\E/Change Loop ${NEW}/" \
            .claude/harness/AGENT.md
          perl -pi -e "s/\Q${PREV}\E/${NEW}/g" \
            .claude/harness/DEVELOPER-SETUP.md

          # Every surface that states the release has to move with it. The
          # documentation suite derives its expectations from VERSION, so a
          # surface left behind here fails `run-doc-consistency.sh` rather than
          # drifting quietly the way the website did for four releases.
          perl -pi -e "s/\*\*Version \Q${PREV}\E\*\*/**Version ${NEW}**/" \
            WORKFLOW.md README.md README.th.md
          perl -pi -e "s/<b>v\Q${PREV}\E<\/b>/<b>v${NEW}<\/b>/" website/index.html
          perl -pi -e "s/\*\*v\Q${PREV}\E\*\*/**v${NEW}**/" \
            website/docs/src/content/docs/index.md \
            website/docs/src/content/docs/th/index.md
          perl -pi -e "s/\| Pin \| v\Q${PREV}\E \|/| Pin | v${NEW} |/" \
            website/docs/src/content/docs/cli.md \
            website/docs/src/content/docs/th/cli.md
          perl -pi -e "s/\| runtime \| \Q${PREV}\E \|/| runtime | ${NEW} |/" \
            website/docs/src/content/docs/cli.md \
            website/docs/src/content/docs/th/cli.md

          grep -q "const VERSION = \"$NEW\"" .claude/harness/foundation.mjs ||
            { echo "::error::.claude/harness/foundation.mjs version not updated"; exit 1; }
          jq -e --arg version "$NEW" '.runtime == $version' \
            .claude/harness/protocol.json >/dev/null ||
            { echo "::error::.claude/harness/protocol.json runtime not updated"; exit 1; }
          grep -q "Change Loop $NEW" .claude/harness/AGENT.md ||
            { echo "::error::.claude/harness/AGENT.md version not updated"; exit 1; }
          grep -q "Change Loop v$NEW" .claude/harness/DEVELOPER-SETUP.md ||
            { echo "::error::.claude/harness/DEVELOPER-SETUP.md version not updated"; exit 1; }
          grep -q 'version` is `'$NEW'`' .claude/harness/DEVELOPER-SETUP.md ||
            { echo "::error::.claude/harness/DEVELOPER-SETUP.md CLI pin not updated"; exit 1; }
          grep -q 'clone tag `v'$NEW'`' .claude/harness/DEVELOPER-SETUP.md ||
            { echo "::error::.claude/harness/DEVELOPER-SETUP.md clone tag not updated"; exit 1; }
          grep -q "claude-foundation/$NEW" .claude/harness/DEVELOPER-SETUP.md ||
            { echo "::error::.claude/harness/DEVELOPER-SETUP.md install path not updated"; exit 1; }

          for f in WORKFLOW.md README.md README.th.md; do
            grep -q "\*\*Version $NEW\*\*" "$f" ||
              { echo "::error::$f version line not updated"; exit 1; }
          done
          grep -q "<b>v$NEW</b>" website/index.html ||
            { echo "::error::website/index.html version line not updated"; exit 1; }
          for f in website/docs/src/content/docs/index.md \
                   website/docs/src/content/docs/th/index.md; do
            grep -q "\*\*v$NEW\*\*" "$f" ||
              { echo "::error::$f version line not updated"; exit 1; }
          done
          for f in website/docs/src/content/docs/cli.md \
                   website/docs/src/content/docs/th/cli.md; do
            grep -q "| Pin | v$NEW |" "$f" ||
              { echo "::error::$f pin row not updated"; exit 1; }
            grep -q "| runtime | $NEW |" "$f" ||
              { echo "::error::$f runtime row not updated"; exit 1; }
          done

          # Release notes = the new section body (header line dropped).
          awk -v new="$NEW" '$0 ~ ("^## \\[" new "\\]") {f=1; next} /^## \[/{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          echo "----- release notes -----"; cat "$RUNNER_TEMP/notes.md"

      - name: Validate rewritten release
        run: |
          set -euo pipefail
          node .claude/tests/harness/run-single-source-tests.mjs
          sh .claude/tests/docs/run-doc-consistency.sh

      - name: Commit, tag, push
        if: env.DRY != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION WORKFLOW.md CHANGELOG.md README.md README.th.md \
            .claude/harness/foundation.mjs \
            .claude/harness/protocol.json \
            .claude/harness/AGENT.md \
            .claude/harness/DEVELOPER-SETUP.md \
            website/index.html \
            website/docs/src/content/docs/index.md \
            website/docs/src/content/docs/th/index.md \
            website/docs/src/content/docs/cli.md \
            website/docs/src/content/docs/th/cli.md
          git commit -m "chore(release): v$NEW"
          git tag -a "v$NEW" -m "Release v$NEW"
          git push origin HEAD:main
          git push origin "v$NEW"

      - name: Compute tarball sha256 + bump formula url/sha
        if: env.DRY != 'true'
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v$NEW.tar.gz"
          SHA=""
          for i in $(seq 1 12); do
            if SHA=$(curl -fsSL "$URL" | shasum -a 256 | awk '{print $1}') && [ -n "$SHA" ]; then break; fi
            echo "tarball not ready yet ($i)"; sleep 5
          done
          [ -n "$SHA" ] || { echo "::error::could not fetch source tarball sha256"; exit 1; }
          # Version-agnostic: the formula may lag more than one version behind
          # (releases can skip versions), so never anchor on $PREV here —
          # v2.9.2 failed on exactly that (formula still at v2.8.1, PREV=2.9.1).
          perl -pi -e "s#archive/refs/tags/v[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz#archive/refs/tags/v${NEW}.tar.gz#" Formula/claude-foundation.rb
          perl -0pi -e "s/^  sha256 \"[0-9a-f]{64}\"/  sha256 \"$SHA\"/m" Formula/claude-foundation.rb
          grep -q "v$NEW.tar.gz" Formula/claude-foundation.rb && grep -q "sha256 \"$SHA\"" Formula/claude-foundation.rb \
            || { echo "::error::formula url/sha not updated"; exit 1; }

      - name: Publish the GitHub release
        if: env.DRY != 'true'
        run: |
          set -euo pipefail
          gh release create "v$NEW" --title "v$NEW" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Build the bottle, arm the formula (upload/commit only when not dry)
        run: |
          set -euo pipefail
          ROOT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$NEW"

          # A dry run has no tag tarball to download. Build an equivalent local
          # source archive from the rewritten worktree so the formula exercises
          # the candidate version and files instead of the previous release.
          if [ "$DRY" = "true" ]; then
            ARCHIVE="$RUNNER_TEMP/claude-foundation-$NEW.tar.gz"
            tar --exclude=.git --exclude=node_modules -czf "$ARCHIVE" .
            SHA=$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')
            perl -0pi -e "s#^  url \".*\"\$#  url \"file://$ARCHIVE\"#m" Formula/claude-foundation.rb
            perl -0pi -e "s/^  sha256 \"[0-9a-f]{64}\"/  sha256 \"$SHA\"/m" Formula/claude-foundation.rb
          fi

          brew tap-new "$TAP" --no-git
          cp Formula/claude-foundation.rb "$(brew --repository "$TAP")/Formula/"
          brew install --build-bottle "$TAP/claude-foundation"
          brew test "$TAP/claude-foundation"
          brew bottle --json --no-rebuild --root-url "$ROOT_URL" "$TAP/claude-foundation" | tee bottle.out

          # brew writes name--version (double dash); a custom root_url downloads
          # via url_encode = name-version (single dash). Rename to match.
          for f in claude-foundation--*.bottle.tar.gz; do mv "$f" "${f/--/-}"; done

          # Replace the formula's existing bottle block with the generated one.
          sed -n '/^  bottle do$/,/^  end$/p' bottle.out > bottle_block.txt
          grep -q 'sha256 cellar:' bottle_block.txt || { echo "::error::failed to extract bottle block"; exit 1; }
          awk '
            /^  bottle do$/ { while ((getline line < "bottle_block.txt") > 0) print line; skip=1; next }
            skip && /^  end$/ { skip=0; next }
            skip { next }
            { print }
          ' Formula/claude-foundation.rb > Formula/claude-foundation.rb.tmp && mv Formula/claude-foundation.rb.tmp Formula/claude-foundation.rb

          ruby -c Formula/claude-foundation.rb
          brew style Formula/claude-foundation.rb

          if [ "$DRY" = "true" ]; then
            echo "::notice::DRY RUN — built the bottle and rewrote the formula but pushed nothing. Diff:"
            git --no-pager diff -- Formula/claude-foundation.rb
            exit 0
          fi

          gh release upload "v$NEW" claude-foundation-*.bottle.tar.gz --clobber
          git add Formula/claude-foundation.rb
          git commit -m "chore(brew): formula for v$NEW (url/sha + bottle)"
          git push origin HEAD:main

      - name: Record reusable rehearsal evidence
        if: env.DRY == 'true'
        run: |
          node scripts/release/rehearsal-evidence.mjs create \
            --version "$NEW" --source-head "$GITHUB_SHA" \
            --file "$RUNNER_TEMP/release-rehearsal-evidence/manifest.json"

      - name: Upload reusable rehearsal evidence
        if: env.DRY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-rehearsal-evidence
          path: ${{ runner.temp }}/release-rehearsal-evidence/manifest.json
          if-no-files-found: error
          retention-days: 7

  # The release job bumps the landing page and both docs locales, then pushes
  # with GITHUB_TOKEN — which fires no push event, so pages.yml never sees the
  # change and the site keeps serving the previous release's numbers. Calling
  # the deploy directly is what closes that gap; a PAT would work too but adds
  # a secret to own, and duplicating the build here would drift from pages.yml.
  # `ref: main` matters: the call would otherwise deploy this run's triggering
  # SHA, which predates the version bump.
  deploy-site:
    needs: release
    if: github.event.inputs.dry_run != 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: main

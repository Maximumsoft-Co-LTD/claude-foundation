[workspace]
members = [
    "crates/changeloop-agent",
    "crates/changeloop-app-server",
    "crates/changeloop-cli",
    "crates/changeloop-config",
    "crates/changeloop-snapshot",
    "crates/changeloop-web",
    "crates/changeloop-harness",
    "crates/changeloop-runtime",
    "crates/changeloop-acp",
    "crates/changeloop-acp-runtime",
    "crates/changeloop-sandbox",
    "crates/changeloop-protocol",
    "crates/changeloop-provider",
    "crates/changeloop-provider-adapters",
    "crates/changeloop-policy",
    "crates/changeloop-session",
    "crates/changeloop-storage",
    "crates/changeloop-project",
    "crates/changeloop-language",
    "crates/changeloop-land",
    "crates/changeloop-tools",
    "crates/changeloop-ops",
    "crates/changeloop-mcp",
    "crates/changeloop-evidence",
    "tests/performance",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/maximumsoft/claude-foundation"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
fs2 = "0.4"
async-trait = "0.1"
futures-util = "=0.3.32"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
tokio = { version = "1.44", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.20"
ts-rs = { version = "11.0", features = ["serde-json-impl"] }
uuid = { version = "1.16", features = ["serde", "v7"] }
url = "2.5"
base64 = "0.22"
ed25519-dalek = "2.2"
keyring = { version = "3.6", default-features = false }
semver = "1.0"
rpassword = "7.4"
zeroize = "1.8"
getrandom = "0.3"
crossterm = "0.29"
ratatui = "0.30.2"
signal-hook = "0.3"
directories = "6.0.0"
unicode-segmentation = "1.12"
unicode-width = "0.2"
libc = "0.2"

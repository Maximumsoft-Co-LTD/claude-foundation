      {
        "id": "preserve-host-support",
        "question": "Should hosts without live hook APIs be rejected or supported with explicit capability limits?",
        "answer": "Preserve supported hosts, report prevention limits truthfully, and retain Land as final enforcement.",
        "source": "user-batch"
      },
      {
        "id": "ownership-based-cleanup",
        "question": "How may an adapter remove stale artifacts safely?",
        "answer": "Delete only exact paths previously recorded as Foundation-owned.",
        "source": "user-batch"
      },
      {
        "id": "post-dispatch-scope",
        "question": "How should the host-adapter plan change after native dispatch became canonical?",
        "answer": "Keep native dispatch as a separate solved capability, preserve the live-guard distinction, and constrain adapter ownership state to .foundation/adapter-manifests/.",
        "source": "user-batch"
      }
    ]

      {
        "id": "DEC-ELIGIBILITY",
        "question": "Which recorded phase rows may govern a session?",
        "answer": "Only rows whose change still has an openspec/changes/<id> directory; the newest remaining eligible row wins.",
        "source": "recommended-default"
      },
      {
        "id": "DEC-LAND-DELIVERY",
        "question": "Which Land shell commands run without the runtime transaction marker?",
        "answer": "git commit and git push only; every other mutating command still requires the marker and is named in the refusal.",
        "source": "user-batch"
      }
    ]
  },
  "risk": {
    "tier": "high",
    "classes": ["control-policy"],
    "rationale": "Both edits narrow a PreToolUse refusal that gates every file and shell mutation, so a mistake widens mutation authority across the whole loop. The guard keeps its fail-closed posture: explicit block mode still refuses without context, file mutation policy is untouched, and only two named delivery command words are separated from tree mutation."

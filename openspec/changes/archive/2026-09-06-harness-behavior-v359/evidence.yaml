      "capabilities": [
        "test"
      ]
    },
    {
      "id": "host-conformance",
      "requirementKey": "host-conformance",
      "scenario": "When resumed hosts release old leases or import repeated observations",
      "impact": "medium",
      "capabilities": [
        "test"
      ]
    },
    {
      "id": "recovery-ownership",
      "requirementKey": "recovery-ownership",

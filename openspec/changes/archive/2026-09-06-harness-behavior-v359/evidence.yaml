      "impact": "medium",
      "capabilities": [
        "test"
      ]
    },
    {
      "id": "resume-context",
      "requirementKey": "resume-context",
      "scenario": "When an agent resumes after agreement, wiring, base or delivery progress changes",
      "impact": "medium",
      "capabilities": [
        "test"
      ]
    },
    {
      "id": "projection-compatibility",
      "requirementKey": "projection-compatibility",

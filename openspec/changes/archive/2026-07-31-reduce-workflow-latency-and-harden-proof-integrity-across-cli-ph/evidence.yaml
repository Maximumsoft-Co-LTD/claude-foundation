      "capabilities": ["test", "review"]
    },
    {
      "id": "capability-scoped-evidence",
      "scenario": "A provider receipt covers only claims that declare that provider capability",
      "impact": "high",
      "capabilities": ["test", "review"]
    },
    {
      "id": "canonical-workspace-identity",
      "scenario": "Equivalent filesystem paths produce one workspace identity for reports, receipts, cleanup, and Land",
      "impact": "high",
      "capabilities": ["test"]
    },
    {
      "id": "public-cli-routing",
      "scenario": "The public CLI resolves and validates the project runtime without requiring direct low-level invocation",
      "impact": "medium",
      "capabilities": ["test", "compatibility"]
    },
    {
      "id": "atomic-proof-run",
      "scenario": "One public command performs readiness, preflight, planning, execution, and audit and returns a structured terminal outcome",
      "impact": "high",
      "capabilities": ["test"]
    },
    {
      "id": "converge-before-proof",

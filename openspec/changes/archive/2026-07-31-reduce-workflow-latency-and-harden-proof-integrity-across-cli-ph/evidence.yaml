      "capabilities": ["test", "observability"]
    },
    {
      "id": "structured-change-scaffold",
      "scenario": "A structured draft materializes valid OpenSpec artifacts once without becoming a second durable ledger",
      "impact": "medium",
      "capabilities": ["test"]
    },
    {
      "id": "adapter-ergonomics",
      "scenario": "Explicit dependency-free adapters parse standard test and mutation results and deduplicate shared browser execution",
      "impact": "medium",
      "capabilities": ["test"]
    },
    {
      "id": "workflow-performance-metrics",
      "scenario": "Metrics distinguish active work, human wait, provider time, context growth, rework, and reuse reasons without inventing unknown values",
      "impact": "medium",
      "capabilities": ["test", "observability"]

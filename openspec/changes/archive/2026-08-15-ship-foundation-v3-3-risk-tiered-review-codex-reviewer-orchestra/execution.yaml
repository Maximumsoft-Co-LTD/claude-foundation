{
  "version": 1,
  "providers": {
    "test": {
      "adapter": "test-discovery",
      "command": ["node", ".claude/tests/harness/run-risk-tiered-review-tests.mjs"],
      "minimum": 9,
      "resources": ["foundation-test-suite"],
      "reportFormat": "json",
      "report": ".foundation/test-results/v33-risk-tiered-review.json",
      "env": {
        "FOUNDATION_RESULT_REPORT": ".foundation/test-results/v33-risk-tiered-review.json"
      },
      "criticalCases": [
        "CASE-GROUNDING-V2",
        "CASE-RISK-ROUTES",
        "CASE-CODEX-PROVENANCE",
        "CASE-SAME-FAMILY-REVIEW",
        "CASE-CRITICAL-EVIDENCE",
        "CASE-PROOF-ONE-SHOT",
        "CASE-UPGRADE-COMPAT",
        "CASE-EXTERNAL-HANDOFF",
        "CASE-REVIEW-REPAIR-CLOSURE"
      ],
      "inputs": [
        "foundation.json",
        ".claude/commands",
        ".claude/skills/grill-task-gu",
        ".claude/harness/runtime",
        ".claude/harness/runtime/contracts",
        "openspec/schemas",
        ".claude/tests/harness/run-risk-tiered-review-tests.mjs",
        ".claude/tests/harness/run-v33-policy-tests.mjs",
        ".claude/harness/tests/grounding-policy.test.mjs",
        ".claude/harness/tests/handoff-policy.test.mjs",
        ".claude/harness/tests/review-repair-closure.test.mjs",
        ".claude/harness/tests/configured-reviewer.test.mjs"
      ]
    },
    "compatibility": {
      "adapter": "command",
      "command": ["sh", ".claude/tests/run-all.sh"],
      "resources": ["foundation-test-suite"],
      "timeoutMs": 360000
    },
    "mutation": {
      "adapter": "command",
      "command": ["node", ".claude/tests/harness/run-risk-tiered-review-mutation.mjs"],
      "resources": ["foundation-test-suite"],
      "resultProtocol": "foundation-mutation-v2",
      "reportFormat": "json",
      "report": ".foundation/test-results/v33-mutation.json",
      "env": {
        "FOUNDATION_RESULT_REPORT": ".foundation/test-results/v33-mutation.json"
      },
      "criticalCases": ["CASE-MUTANT-KILLER"],
      "requiredMutants": ["MUT-KILLER-BINDING"],
      "mutantKillers": {
        "MUT-KILLER-BINDING": "CASE-MUTANT-KILLER"
      },
      "inputs": [
        ".claude/harness/runtime/evidence/adapter-runtime.mjs",
        ".claude/tests/harness/run-risk-tiered-review-mutation.mjs"
      ]
    },
    "security-static": {
      "adapter": "command",
      "command": ["node", "--check", ".claude/harness/runtime/workflow/handoff-runtime.mjs"],
      "resources": ["foundation-test-suite"],
      "inputs": [
        ".claude/harness/runtime/workflow/handoff-runtime.mjs"
      ]
    },
    "deployment": {
      "adapter": "command",
      "command": ["node", ".claude/harness/tests/handoff-policy.test.mjs"],
      "resources": ["foundation-test-suite"],
      "inputs": [
        ".claude/harness/runtime/workflow/handoff-runtime.mjs",
        ".claude/harness/runtime/workflow/land-runtime.mjs",
        ".claude/harness/tests/handoff-policy.test.mjs",
        "openspec/schemas/foundation-standard/templates/handoffs.yaml",
        "openspec/schemas/foundation-rapid/templates/handoffs.yaml"
      ]
    },
    "review": {
      "adapter": "external"
    }
  },
  "services": {}
}

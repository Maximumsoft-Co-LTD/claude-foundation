    "decisions": [
      {
        "id": "review-policy-v33",
        "question": "Which bounded review policy should Foundation implement?",
        "answer": "Low uses one AI full review. Medium and high use one AI full plus one finding-bound delta only after correction. No tier dispatches a third AI.",
        "source": "user-batch"
      },
      {
        "id": "high-risk-human-boundary",
        "question": "Must high-risk Prove wait for mandatory human approval?",
        "answer": "No. Ask predefined material risks once in the initial Decision Sheet so developers can continue; Prove remains AI-bounded without a human gate.",
        "source": "user-batch"
      },
      {
        "id": "codex-independent-reviewer",
        "question": "How should Codex participate as an independent reviewer?",
        "answer": "Use configured gpt-5.6-sol, high reasoning, exact cwd, read-only ephemeral execution, structured output, truthful session provenance, and model-family diversity.",
        "source": "user-batch"
      },
      {
        "id": "single-family-configured-reviewers",
        "question": "How should Codex-only and Claude-Code-only teams satisfy review without another provider family?",
        "answer": "Support codex-cli and claude-cli as configured read-only reviewers. A committed single-model diversity waiver permits the same provider/model family, but the reviewer must retain a distinct identity and fresh session with truthful provenance; the waiver never claims observed diversity.",
        "source": "user-batch"
      },
      {
        "id": "proof-no-loop",
        "question": "How should Build and Prove avoid repeated correction loops without weakening quality?",
        "answer": "Name critical cases and mutants, serialize proof mutations, require current-workspace evidence, persist completed review findings, and stop on bounded typed exits.",
        "source": "user-batch"
      },
      {
        "id": "external-operation-handoff",
        "question": "What happens when implementation needs AWS, secret, Terraform, deploy, restart, or environment authority the developer does not have?",
        "answer": "Finish repository implementation, declare a named DevOps handoff, and continue Prove. Land permits only an accepted tracked post-land operation proven safe before activation; every pre-land or activation-coupled operation waits for named completion evidence.",
        "source": "user-batch"
      },
      {
        "id": "post-build-question-boundary",
        "question": "When may Build or Prove ask another question after the initial Decision Sheet?",
        "answer": "Only when new evidence contradicts the locked behavior, compatibility, security, data, or rollout decision. In-contract defects auto-repair; CLI/model/provider failures use bounded infrastructure recovery; missing permission becomes EXTERNAL_WAIT without an interview.",
        "source": "user-batch"
      }
    ]
  },

      "scenario": "A correction round keeps the landed comparison",
      "impact": "low",
      "capabilities": [
        "test"
      ]
    },
    {
      "id": "review-diff-excludes-landed-the-review-diff-is-built-for-bravo-2",
      "requirementKey": "review-diff-excludes-landed",
      "scenario": "A file no earlier change landed keeps the base diff",
      "impact": "low",
      "capabilities": [
        "test"
      ]
    },
    {
      "id": "review-diff-excludes-landed-the-review-diff-is-built-for-bravo-3",
      "requirementKey": "review-diff-excludes-landed",

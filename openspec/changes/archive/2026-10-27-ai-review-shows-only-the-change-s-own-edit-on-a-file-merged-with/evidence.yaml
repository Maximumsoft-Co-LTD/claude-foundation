      "minimum": 1,
      "reportFormat": "auto",
      "claims": "declared",
      "segments": [
        "node --test .claude/harness/tests/concurrent-same-file.test.mjs",
        "node --test .claude/harness/tests/configured-reviewer.test.mjs .claude/harness/tests/packet-value.test.mjs",

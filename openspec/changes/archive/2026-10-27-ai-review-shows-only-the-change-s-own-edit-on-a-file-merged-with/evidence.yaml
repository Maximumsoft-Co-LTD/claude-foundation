  "providers": {
    "test": {
      "adapter": "test-discovery",
      "command": [
        "sh",
        "-c",
        "(node --test .claude/harness/tests/concurrent-same-file.test.mjs) && (node --test .claude/harness/tests/configured-reviewer.test.mjs .claude/harness/tests/packet-value.test.mjs) && (bash .claude/tests/docs/run-doc-consistency.sh) && (node --test .claude/harness/tests/packet-value.test.mjs)"

      "capabilities": [
        "test"
      ]
    },
    {
      "id": "review-diff-excludes-landed-the-review-diff-is-built-for-bravo",
      "requirementKey": "review-diff-excludes-landed",
      "scenario": "A merged file shows only this change's lines",
      "impact": "low",
      "capabilities": [
        "test"
      ]
    },
    {
      "id": "review-diff-excludes-landed-the-correction-round-s-review-inspec",

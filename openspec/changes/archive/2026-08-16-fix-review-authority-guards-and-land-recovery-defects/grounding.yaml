    "decisions": [
      {
        "id": "D1-receipt-guard",
        "question": "How should the 'completed AI response has no receipt' guard be made sound?",
        "answer": "Reconcile latest-vs-latest: locate the receipt's recorded attempt in the chain and fail only when the latest delivered AI attempt is newer than the newest recorded receipt of any reviewer type; use error-excluding deliveredAiAttempts at both guard sites. Rejected: recording all historical receipt digests (wire-visible receipt change).",
        "source": "recommended-default"
      },
      {
        "id": "D2-schema-uniqueitems",
        "question": "How should REVIEW_SCHEMA become acceptable to OpenAI structured output?",
        "answer": "Delete uniqueItems from the schema; validReview/validStringList already reject duplicates after parse. Rejected: provider-conditional schema variants.",
        "source": "recommended-default"
      },
      {
        "id": "D3-infra-reset",
        "question": "What form does the infrastructure-retry reset take?",
        "answer": "authority reset-infra <change> --decision-ref <ref>: re-run the prove-stage provider diagnosis in-process; on pass, record acknowledged infrastructure attempt digests in state.reviewHistory so infrastructureAiAttempts skips them; refuse a reused decision-ref or failing diagnosis; never mutate the attempt chain. Rejected: automatic reset on doctor pass (unbounded), deleting attempt records (breaks the hash chain).",
        "source": "recommended-default"
      },
      {
        "id": "D4-apply-refresh",
        "question": "How is refreshAppliedProjection exposed?",
        "answer": "Accept --refresh as a strict boolean flag on sandbox apply, routed to the existing options.refresh; controlPlane stays internal; unknown flags still die. Rejected: a separate sandbox refresh command.",
        "source": "recommended-default"
      },
      {
        "id": "D5-validate-lint",
        "question": "How does the SHALL/MUST lint surface at change validate?",
        "answer": "When the OpenSpec CLI probe succeeds, run openspec validate <id> --strict --json --no-interactive during change validate and fail with its findings; when the CLI is absent, warn and continue (land keeps the hard requirement). Rejected: reimplementing the lint in the harness (drift).",
        "source": "recommended-default"
      },
      {
        "id": "D6-defer-telemetry",
        "question": "Is the null per-operation requests/cost defect in scope?",
        "answer": "No — defect 6 is deferred to a follow-up telemetry change; this change fixes the five land-blocking defects.",
        "source": "recommended-default"
      }
    ]
  },

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d" font-family="Manrope, 'Noto Sans Thai', system-ui, sans-serif">
  <title id="t">Who owns which files</title>
  <desc id="d">Three columns. Yours: project configuration, instruction files and the OpenSpec agreements for your changes; the agent may edit them for you. Installed by Change Loop: commands, skills, rules, hooks, harness and schemas, overwritten on every install. Generated by the harness: the .foundation folder with sandboxes, receipts and logs, ignored by Git and never edited by hand.</desc>
  <rect x=".5" y=".5" width="959" height="359" rx="10" fill="#faf7f0" stroke="#d7d0c3"/>

  <rect x="24" y="24" width="296" height="268" rx="8" fill="#ffe3da" stroke="#ff5c35" stroke-width="1.5"/>
  <rect x="332" y="24" width="296" height="268" rx="8" fill="#fff" stroke="#17181c" stroke-width="1.5"/>
  <rect x="640" y="24" width="296" height="268" rx="8" fill="#e1ece6" stroke="#087a64" stroke-width="1.5"/>

  <g font-size="15" font-weight="700" text-anchor="start">
    <text x="42" y="54" fill="#8f2a11">Yours</text>
    <text x="350" y="54" fill="#17181c">Installed by Change Loop</text>
    <text x="658" y="54" fill="#087a64">Generated by the harness</text>
  </g>
  <g font-size="12" fill="#373a42">
    <text x="42" y="76">Kept across every upgrade.</text>
    <text x="350" y="76">Overwritten on every install.</text>
    <text x="658" y="76">Machine state, ignored by Git.</text>
  </g>

  <g font-family="'DM Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#17181c">
    <text x="42" y="108">foundation.json</text>
    <text x="42" y="130">openspec/config.yaml</text>
    <text x="42" y="152">openspec/repositories.yaml</text>
    <text x="42" y="174">openspec/changes/&lt;id&gt;/</text>
    <text x="42" y="196">.claude/settings.json</text>
    <text x="42" y="218">CLAUDE.md · AGENTS.md</text>

    <text x="350" y="108">.claude/commands</text>
    <text x="350" y="130">.claude/skills · rules · hooks</text>
    <text x="350" y="152">.claude/harness</text>
    <text x="350" y="174">.claude/orchestrator.md</text>
    <text x="350" y="196">openspec/schemas</text>
    <text x="350" y="218">WORKFLOW.md</text>

    <text x="658" y="108">.foundation/sandboxes</text>
    <text x="658" y="130">.foundation/receipts</text>
    <text x="658" y="152">.foundation/transactions</text>
    <text x="658" y="174">.foundation/logs</text>
    <text x="658" y="196">.foundation/packages</text>
    <text x="658" y="218">.foundation/runtime</text>
  </g>

  <g font-size="12" fill="#373a42">
    <text x="42" y="250" font-weight="700" fill="#8f2a11">Change by asking the agent.</text>
    <text x="42" y="268">It edits these on your behalf.</text>
    <text x="350" y="250" font-weight="700" fill="#17181c">Do not edit.</text>
    <text x="350" y="268">Your changes would be lost on upgrade.</text>
    <text x="658" y="250" font-weight="700" fill="#087a64">Do not edit or delete.</text>
    <text x="658" y="268">The harness recovers from it.</text>
  </g>

  <text x="480" y="326" font-size="13" fill="#373a42" text-anchor="middle">Not sure whether a file is safe to touch? Ask the agent, or see <tspan font-weight="700">Files and ownership</tspan>.</text>
</svg>

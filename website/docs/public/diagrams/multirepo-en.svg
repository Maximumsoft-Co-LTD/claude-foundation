<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d" font-family="Manrope, 'Noto Sans Thai', system-ui, sans-serif">
  <title id="t">One change across several repositories</title>
  <desc id="d">Three scopes are declared in order: the project lists the repositories it may use, the change selects which to read or write, and evidence commands name what they need. One change then builds the api repository first, then the app repository that depends on it, with contracts and a partner SDK read-only. One proof covers all of them and one Land applies them together.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#17181c"/></marker>
  </defs>
  <rect x=".5" y=".5" width="959" height="359" rx="10" fill="#faf7f0" stroke="#d7d0c3"/>

  <g font-family="'DM Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#6a6c71" letter-spacing="1">
    <text x="30" y="30">1 · PROJECT TOPOLOGY</text><text x="330" y="30">2 · THIS CHANGE'S SCOPE</text><text x="650" y="30">3 · ONE PROOF, ONE LAND</text>
  </g>

  <!-- column 1 -->
  <g fill="#fff" stroke="#17181c" stroke-width="1.5">
    <rect x="30" y="44" width="240" height="46" rx="6"/><rect x="30" y="100" width="240" height="46" rx="6"/><rect x="30" y="156" width="240" height="46" rx="6"/><rect x="30" y="212" width="240" height="46" rx="6"/>
  </g>
  <g font-family="'DM Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="500" fill="#17181c">
    <text x="44" y="72">api</text><text x="44" y="128">app</text><text x="44" y="184">contracts</text><text x="44" y="240">partner-sdk</text>
  </g>
  <g font-size="11.5" fill="#6a6c71" text-anchor="end">
    <text x="258" y="72">services/api</text><text x="258" y="128">apps/web</text><text x="258" y="184">read-only</text><text x="258" y="240">outside the repo</text>
  </g>
  <text x="30" y="282" font-size="12" fill="#373a42">Every repository must be an initialized Git repo.</text>

  <!-- column 2 -->
  <g stroke="#17181c" stroke-width="1.5" marker-end="url(#a)"><path d="M272 67h52"/><path d="M272 123h52"/><path d="M272 179h52"/><path d="M272 235h52"/></g>
  <g>
    <rect x="330" y="44" width="240" height="46" rx="6" fill="#ffe3da" stroke="#ff5c35" stroke-width="1.5"/>
    <rect x="330" y="100" width="240" height="46" rx="6" fill="#ffe3da" stroke="#ff5c35" stroke-width="1.5"/>
    <rect x="330" y="156" width="240" height="46" rx="6" fill="#efe9dc" stroke="#bcb4a6"/>
    <rect x="330" y="212" width="240" height="46" rx="6" fill="#efe9dc" stroke="#bcb4a6"/>
  </g>
  <g font-size="12.5" fill="#373a42">
    <text x="344" y="72"><tspan font-weight="700" fill="#8f2a11">write</tspan> · built first</text>
    <text x="344" y="128"><tspan font-weight="700" fill="#8f2a11">write</tspan> · after api (dependsOn)</text>
    <text x="344" y="184"><tspan font-weight="700">read</tspan> · part of proof identity</text>
    <text x="344" y="240"><tspan font-weight="700">read</tspan> · part of proof identity</text>
  </g>
  <text x="330" y="282" font-size="12" fill="#373a42">Select only what the change needs.</text>

  <!-- column 3 -->
  <g stroke="#17181c" stroke-width="1.5" marker-end="url(#a)"><path d="M572 67h72"/><path d="M572 123h72"/></g>
  <rect x="650" y="44" width="280" height="102" rx="8" fill="#17181c"/>
  <g font-size="13" fill="#f2eee5">
    <text x="666" y="72" font-weight="700">Build in isolation</text>
    <text x="666" y="92">one sandbox per written repo</text>
    <text x="666" y="112">Prove once across all selected</text>
    <text x="666" y="132">Land once, resumes if interrupted</text>
  </g>
  <rect x="650" y="156" width="280" height="102" rx="8" fill="#e1ece6" stroke="#087a64" stroke-width="1.5"/>
  <g font-size="12.5" fill="#373a42">
    <text x="666" y="182" font-weight="700" fill="#087a64">Result: archived</text>
    <text x="666" y="202">One uncommitted diff per written</text>
    <text x="666" y="220">repository. Nothing is committed</text>
    <text x="666" y="238">or pushed for you.</text>
  </g>

  <text x="480" y="326" font-size="13" fill="#373a42" text-anchor="middle">Declare in this order. A check cannot prove a repository the project or the change has not selected.</text>
</svg>
